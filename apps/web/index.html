<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Pulse</title>
    <script>
      // Runs before first paint, so there is no flash of the wrong theme or
      // accent. Reads the same localStorage keys the Zustand stores persist.
      (function () {
        try {
          var ui = JSON.parse(localStorage.getItem("pulse-ui") || "{}").state || {};
          var pref = ui.theme || "dark";
          var dark = pref === "dark" || (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          var s = JSON.parse(localStorage.getItem("pulse-session") || "{}").state || {};
          var active = s.sessions && s.activeTenantId && s.sessions[s.activeTenantId];
          if (active) document.documentElement.style.setProperty("--accent", active.tenant.accent);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
